{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Event</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; }</style>
</head>
<body>
    <div class="card shadow p-4 text-center" style="max-width: 500px; border-radius: 15px;">
        <h3 class="text-danger fw-bold mb-3">Delete Event?</h3>
        <p class="lead">Are you sure you want to delete <strong>"{{ event.title }}"</strong>?</p>
        <p class="text-muted small">This action cannot be undone.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="{% url 'event_detail' event.pk %}" class="btn btn-secondary px-4">Cancel</a>
                <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
            </div>
        </form>
    </div>
</body>
</html>
