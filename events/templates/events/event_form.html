{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Event | EventHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .form-container { max-width: 600px; margin: 50px auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .btn-primary { background-color: #3b82f6; border: none; padding: 10px 20px; width: 100%; border-radius: 8px; font-weight: 600; }
        .btn-primary:hover { background-color: #2563eb; }
        .form-label { font-weight: 600; color: #1e293b; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-container">
            <h2 class="text-center fw-bold mb-4">{{ title }}</h2>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary mt-4">Publish Event</button>
                <a href="{% url 'home' %}" class="btn btn-link text-muted d-block text-center mt-3 text-decoration-none">Cancel</a>
            </form>
        </div>
    </div>

</body>
</html>
