{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ event.title }} | EventHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .detail-card { border: none; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: white; }
        .detail-img-wrapper { height: 400px; background: #0f172a; display: flex; align-items: center; justify-content: center; position: relative; }
        .detail-img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 30px; text-decoration: none; color: #0f172a; font-weight: 600; transition: all 0.3s; }
        .back-btn:hover { background: white; transform: translateX(-5px); }
        .meta-box { background: #f1f5f9; padding: 15px; border-radius: 12px; display: inline-flex; align-items: center; margin-right: 15px; color: #475569; font-weight: 500; }
        .meta-box i { color: #3b82f6; margin-right: 8px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card detail-card">
                    
                    <div class="detail-img-wrapper">
                        <a href="{% url 'home' %}" class="back-btn"><i class="bi bi-arrow-left"></i> Back to Events</a>
                        {% if event.poster %}
                            <img src="{{ event.poster.url }}" class="detail-img" alt="{{ event.title }}">
                        {% endif %}
                    </div>

                    <div class="card-body p-5">
                        <h1 class="fw-bold display-5 text-dark mb-4">{{ event.title }}</h1>
                        
                        <div class="mb-5">
                            <div class="meta-box">
                                <i class="bi bi-calendar-event"></i> {{ event.date|date:"d M Y" }}
                            </div>
                            <div class="meta-box">
                                <i class="bi bi-clock"></i> {{ event.date|date:"H:i" }}
                            </div>
                            <div class="meta-box">
                                <i class="bi bi-geo-alt-fill"></i> {{ event.location }}
                            </div>
                        </div>

                        <h4 class="fw-bold mb-3">About Event</h4>
                        <p class="lead text-muted" style="line-height: 1.8;">
                            {{ event.description|linebreaks }}
                        </p>

                        <hr class="my-5">

                        <div class="d-flex gap-3">
                            <a href="{% url 'edit_event' event.pk %}" class="btn btn-outline-secondary px-4">Edit Event</a>
                            
                            <a href="{% url 'delete_event' event.pk %}" class="btn btn-outline-danger px-4">Delete Event</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
